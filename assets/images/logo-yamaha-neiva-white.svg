<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="480" height="120">
  <defs>
    <linearGradient id="yamahaRedGradWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1A2A"/>
      <stop offset="100%" stop-color="#E60012"/>
    </linearGradient>
    <filter id="glowWhite" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Isotipo: Emblema circular Yamaha con los 3 diapasones -->
  <g transform="translate(10, 10)" filter="url(#glowWhite)">
    <!-- Círculo rojo exterior -->
    <circle cx="50" cy="50" r="48" fill="url(#yamahaRedGradWhite)" stroke="#FFFFFF" stroke-width="2.5"/>
    
    <!-- Anillo interior blanco -->
    <circle cx="50" cy="50" r="40" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    
    <!-- Diapasón vertical (12 en punto) -->
    <path d="M 50,14 L 50,50 M 46,18 L 46,30 A 4,4 0 0,0 54,30 L 54,18" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    
    <!-- Diapasón inferior derecho (4 en punto) -->
    <g transform="rotate(120, 50, 50)">
      <path d="M 50,14 L 50,50 M 46,18 L 46,30 A 4,4 0 0,0 54,30 L 54,18" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    </g>
    
    <!-- Diapasón inferior izquierdo (8 en punto) -->
    <g transform="rotate(240, 50, 50)">
      <path d="M 50,14 L 50,50 M 46,18 L 46,30 A 4,4 0 0,0 54,30 L 54,18" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Centro de unión -->
    <circle cx="50" cy="50" r="7" fill="#FFFFFF"/>
    <circle cx="50" cy="50" r="3.5" fill="#E60012"/>
  </g>

  <!-- Tipografía: YAMAHA (Blanco para fondo oscuro) -->
  <text x="125" y="60" 
        font-family="'Anton', 'Montserrat', 'Arial Black', sans-serif" 
        font-size="48" 
        font-weight="900" 
        letter-spacing="2" 
        fill="#FFFFFF">
    YAMAHA
  </text>

  <!-- Placa distintiva: NEIVA -->
  <g transform="translate(325, 24)">
    <rect x="0" y="0" width="140" height="42" rx="6" fill="#E60012" stroke="#FFFFFF" stroke-width="1"/>
    <text x="70" y="29" 
          font-family="'Anton', 'Montserrat', 'Arial Black', sans-serif" 
          font-size="26" 
          font-weight="900" 
          letter-spacing="3" 
          text-anchor="middle" 
          fill="#FFFFFF">
      NEIVA
    </text>
  </g>

  <!-- Subtítulo Regional: HUILA • CONCESIONARIO AUTORIZADO -->
  <g transform="translate(126, 88)">
    <rect x="0" y="0" width="340" height="4" fill="#FFE713" rx="2"/>
    <text x="2" y="18" 
          font-family="'Lexend', 'Montserrat', sans-serif" 
          font-size="11" 
          font-weight="800" 
          letter-spacing="2.5" 
          fill="#FFE713">
      HUILA • CONCESIONARIO AUTORIZADO
    </text>
  </g>
</svg>
